services:
  db:
    image: pgvector/pgvector:pg17
    container_name: entrostic-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entrostic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entrostic}
      POSTGRES_DB: ${POSTGRES_DB:-entrostic}
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entrostic}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
